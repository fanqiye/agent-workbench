<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>事务工作台</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><div><strong>事务工作台</strong><span>资料 · 数据 · 日程</span></div><span class="local">本机 / 合成演示数据</span></header>
<main><aside><h2>执行记录</h2><button id="refresh" class="plain" type="button">刷新记录</button><nav id="history" aria-label="历史任务"></nav><p class="muted">所有运行记录保存在本机。日程只有确认后才导出，未接入个人账号。</p></aside>
<section class="workspace"><form id="request"><div class="eyebrow">新建任务</div><h1 id="heading">资料核查</h1><label for="profile">工作方式</label><select id="profile"><option value="knowledge">资料核查 · 原文引用</option><option value="analyst">经营分析 · 受限 SQL</option><option value="planner">个人安排 · 约束规划</option></select><p id="description" class="muted"></p><label for="question">需要解决的问题</label><textarea id="question" rows="3" maxlength="1500" required></textarea><div class="actions"><button type="submit" id="run">开始调查</button><span class="muted">本地模型 · 最多 12 轮</span></div></form>
<p id="notice" role="status" aria-live="polite"></p><article id="detail" hidden><div class="result-title"><h2>调查结果</h2><span id="status" class="badge"></span></div><p id="runmeta" class="muted"></p><div id="result"></div><div id="approval" hidden><label for="reason">核对后的确认说明</label><input id="reason" maxlength="300" placeholder="已核对所有任务、已有事件与截止时间"><button id="approve" type="button">确认并导出日历</button></div><a id="download" hidden>下载已确认的 .ics 文件</a><button id="cancel" type="button" class="plain" hidden>取消本次任务</button><h2>工具与执行记录</h2><div id="trace"></div></article></section></main>
<footer>模型文字是待核对的草稿。原文、查询结果和时间约束分别由代码检查；流程完成不等于回答正确。</footer></body></html>
